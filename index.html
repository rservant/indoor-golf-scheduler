<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indoor Golf Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fb;
            color: #111827;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .loading-spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #059669;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        .loading p {
            font-size: 0.8125rem;
            color: #9ca3af;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            max-width: 480px;
            margin: 2rem auto;
            background: #fef2f2;
            color: #991b1b;
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid #fecaca;
            font-size: 0.875rem;
        }

        .error h3 {
            color: #dc2626;
            margin-bottom: 0.375rem;
            font-size: 0.9375rem;
        }

        .btn {
            background: #059669;
            color: #fff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8125rem;
            font-weight: 500;
            margin-top: 0.75rem;
            transition: background 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            background: #047857;
        }

        .app-loaded {
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div id="golf-scheduler-app">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading…</p>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('error', (event) => {
            console.error('Application error:', event.error);
            const container = document.getElementById('golf-scheduler-app');
            if (container && !container.querySelector('.app-loaded')) {
                container.innerHTML = `
                    <div class="error">
                        <h3>Failed to Load</h3>
                        <p>${event.error ? event.error.message : 'Unknown error'}</p>
                        <button class="btn" onclick="location.reload()">Reload</button>
                    </div>
                `;
            }
        });
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Module loading error:', event.reason);
            const container = document.getElementById('golf-scheduler-app');
            if (container && !container.querySelector('.app-loaded')) {
                container.innerHTML = `
                    <div class="error">
                        <h3>Failed to Load</h3>
                        <p>${event.reason ? event.reason.message || event.reason : 'Module loading failed'}</p>
                        <button class="btn" onclick="location.reload()">Reload</button>
                    </div>
                `;
            }
        });
    </script>
    <script type="module" src="src/index.ts"></script>
</body>

</html>
