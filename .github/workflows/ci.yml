name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI_STORAGE_OPTIMIZATION: true
      CI_STORAGE_MAX_SIZE: 2097152
      CI_STORAGE_COMPRESSION: true
      CI_STORAGE_AGGRESSIVE_CLEANUP: true
      CI_STORAGE_REDUCED_ITERATIONS: true
      CI_STORAGE_FALLBACK_ENABLED: true
      CI_STORAGE_MONITORING: true
      CI_STORAGE_METRICS_REPORTING: true

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      run: npm run test:ci
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    - name: Build frontend
      run: npm run build

    - name: Type check
      run: npm run type-check

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Start development server
      run: npm run dev &

    - name: Wait for server to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:3000; do sleep 1; done'

    - name: Run Playwright e2e tests
      run: npm run test:e2e:ci
      env:
        CI_STORAGE_OPTIMIZATION: true
        CI_STORAGE_LIGHTWEIGHT_FIXTURES: true

  tauri-build:
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src-tauri/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Install dependencies
      run: npm ci

    - name: Build Tauri app
      run: npx tauri build
